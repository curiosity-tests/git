name: CI

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input so racecar can drive the run and pick
#      baseline vs instrumented.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action; `chalk:` is the only variable separating the arms.
#   3. permissions: id-token: write for the action's OIDC connect (the block
#      zeroes unlisted scopes, so everything upstream relied on is restated).
#   4. A fail-closed assertion on the instrumented arm.
#   5. fail-fast: false on every matrix -- a measurement-integrity change, not a
#      build change: the instrumented arm has strictly more failure surface, so
#      leaving fail-fast on cancels instrumented siblings more often than
#      baseline ones and biases the comparison.
#   6. the concurrency group carries the leg. Both arms run on the same ref, so
#      upstream's github.ref-keyed group put them in one group and the second
#      dispatch cancelled the first. Also cancellation-only, never a build change.
# Build and test COMMANDS are unchanged from upstream.

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
  pull_request:

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  DEVELOPER: 1

# If more than one workflow run is triggered for the very same commit hash
# (which happens when multiple branches pointing to the same commit), only
# the first one is allowed to run, the second will be kept in the "queued"
# state. This allows a successful completion of the first run to be reused
# in the second run via the `skip-if-redundant` logic in the `config` job.
#
# The only caveat is that if a workflow run is triggered for the same commit
# hash that another run is already being held, that latter run will be
# canceled. For more details about the `concurrency` attribute, see:
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ${{ github.sha }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}

permissions:
  contents: read
  id-token: write

jobs:
  ci-config:
    name: config
    if: vars.CI_BRANCHES == '' || contains(vars.CI_BRANCHES, github.ref_name)
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check-ref.outputs.enabled }}${{ steps.skip-if-redundant.outputs.enabled }}
      skip_concurrent: ${{ steps.check-ref.outputs.skip_concurrent }}
    steps:
    - name: try to clone ci-config branch
      run: |
        git -c protocol.version=2 clone \
          --no-tags \
          --single-branch \
          -b ci-config \
          --depth 1 \
          --no-checkout \
          --filter=blob:none \
          https://github.com/${{ github.repository }} \
          config-repo &&
        cd config-repo &&
        git checkout HEAD -- ci/config || : ignore
    - id: check-ref
      name: check whether CI is enabled for ref
      run: |
        enabled=yes
        if test -x config-repo/ci/config/allow-ref
        then
          echo "::warning::ci/config/allow-ref is deprecated; use CI_BRANCHES instead"
          if ! config-repo/ci/config/allow-ref '${{ github.ref }}'
          then
            enabled=no
          fi
        fi

        skip_concurrent=yes
        if test -x config-repo/ci/config/skip-concurrent &&
           ! config-repo/ci/config/skip-concurrent '${{ github.ref }}'
        then
          skip_concurrent=no
        fi
        echo "enabled=$enabled" >>$GITHUB_OUTPUT
        echo "skip_concurrent=$skip_concurrent" >>$GITHUB_OUTPUT
    - name: skip if the commit or tree was already tested
      id: skip-if-redundant
      uses: actions/github-script@v9
      if: steps.check-ref.outputs.enabled == 'yes'
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          try {
            // Figure out workflow ID, commit and tree
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const workflow_id = run.workflow_id;
            const head_sha = run.head_sha;
            const tree_id = run.head_commit.tree_id;

            // See whether there is a successful run for that commit or tree
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 500,
              status: 'success',
              workflow_id,
            });
            for (const run of runs.workflow_runs) {
              if (head_sha === run.head_sha) {
                core.warning(`Successful run for the commit ${head_sha}: ${run.html_url}`);
                core.setOutput('enabled', ' but skip');
                break;
              }
              if (run.head_commit && tree_id === run.head_commit.tree_id) {
                core.warning(`Successful run for the tree ${tree_id}: ${run.html_url}`);
                core.setOutput('enabled', ' but skip');
                break;
              }
            }
          } catch (e) {
            core.warning(e);
          }

  regular:
    name: ${{matrix.vector.jobname}} (${{matrix.vector.pool}})
    needs: ci-config
    if: needs.ci-config.outputs.enabled == 'yes'
    concurrency:
      group: ${{ matrix.vector.jobname }}-${{ matrix.vector.pool }}-${{ github.ref }}-${{ inputs.leg || 'push' }}-${{ inputs.racecar_run }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        vector:
        - jobname: osx-clang
          cc: clang
          pool: macos-14
        - jobname: osx-reftable
          cc: clang
          pool: macos-14
        - jobname: osx-gcc
          cc: gcc-13
          pool: macos-14
        - jobname: osx-meson
          cc: clang
          pool: macos-14
    env:
      CC: ${{matrix.vector.cc}}
      CC_PACKAGE: ${{matrix.vector.cc_package}}
      jobname: ${{matrix.vector.jobname}}
      CI_JOB_IMAGE: ${{matrix.vector.pool}}
      TEST_OUTPUT_DIRECTORY: ${{github.workspace}}/t
    runs-on: ${{matrix.vector.pool}}
    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false

    - run: ci/install-dependencies.sh
    - run: ci/run-build-and-tests.sh
    - name: print test failures
      if: failure() && env.FAILED_TEST_ARTIFACTS != ''
      run: ci/print-test-failures.sh
    - name: Upload failed tests' directories
      if: failure() && env.FAILED_TEST_ARTIFACTS != ''
      uses: actions/upload-artifact@v7
      with:
        name: failed-tests-${{matrix.vector.jobname}}
        path: ${{env.FAILED_TEST_ARTIFACTS}}
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  fuzz-smoke-test:
    name: fuzz smoke test
